<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>رحلة فارس</title>
  <meta name="theme-color" content="#5f3dc4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="رحلة فارس">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <style>
    @font-face { font-family: Cairo; font-weight: 400; src: url(assets/fonts/cairo-arabic-400-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFC; }
    @font-face { font-family: Cairo; font-weight: 700; src: url(assets/fonts/cairo-arabic-700-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFC; }
    @font-face { font-family: Cairo; font-weight: 800; src: url(assets/fonts/cairo-arabic-800-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFC; }
    @font-face { font-family: Cairo; font-weight: 400; src: url(assets/fonts/cairo-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
    @font-face { font-family: Cairo; font-weight: 700; src: url(assets/fonts/cairo-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
    @font-face { font-family: Cairo; font-weight: 800; src: url(assets/fonts/cairo-latin-800-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
    html, body { margin: 0; height: 100%; background: #1c3f75; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #game { direction: ltr; position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
    #rotate { display: none; position: fixed; inset: 0; background: #5f3dc4; color: #fff; font: 800 28px Cairo, sans-serif; align-items: center; justify-content: center; text-align: center; z-index: 9; }
    #rotate.on { display: flex; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate">📱↻<br>لفّ الجهاز بالعرض علشان نلعب</div>
  <span style="font-family:Cairo;font-weight:800;position:absolute;opacity:0">.فارس</span>
  <script>
    // حجم حقيقي (iOS بيغلّط في vh و media orientation بعد اللف)
    function fit() {
      var w = window.innerWidth, h = window.innerHeight;
      var g = document.getElementById('game');
      g.style.width = w + 'px'; g.style.height = h + 'px';
      document.getElementById('rotate').className = (h > w && w < 900) ? 'on' : '';
      if (window.__game && window.__game.scale) window.__game.scale.refresh();
    }
    ['resize', 'orientationchange'].forEach(function (e) { addEventListener(e, function () { fit(); setTimeout(fit, 150); setTimeout(fit, 500); setTimeout(fit, 1200); }); });
    fit();
  </script>
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="js/main.js?v=7"></script>
</body>
</html>
